<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHS Freshman Volleyball — Highlights</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#181818;font:16px Arial,Helvetica,sans-serif}header{background:#111;color:white;padding:30px 20px}header .wrap,main{max-width:980px;margin:auto}header h1{margin:0 0 7px;font-size:clamp(25px,5vw,40px)}header p{margin:0;color:#ddd}main{padding:25px 18px 60px}h2{font-size:22px;margin:22px 0 12px}h3{margin:0 0 5px;font-size:17px}.muted{color:#666;font-size:14px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}.player,.match,.clip{background:#fff;border:1px solid #ddd;border-radius:13px;padding:16px}.player,.match{cursor:pointer;text-align:left;color:inherit;font:inherit}.player:hover,.match:hover{border-color:#777}.player{display:flex;align-items:center;gap:12px}.avatar{width:43px;height:43px;flex:none;display:grid;place-items:center;background:#e9edf0;border-radius:50%;font-weight:bold;color:#444}.match{width:100%;display:flex;align-items:center;justify-content:space-between;margin:10px 0;gap:12px}.match strong{font-size:18px}.clip{margin:10px 0;display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.clip .info{min-width:0}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.actions a{color:#1756a0;font-size:14px;font-weight:bold;white-space:nowrap}.tag{display:inline-block;background:#eef1f5;border-radius:6px;padding:4px 7px;margin:7px 5px 0 0;font-size:12px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.toolbar label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#555}.toolbar select,.toolbar input,.back{border:1px solid #bbb;border-radius:9px;padding:10px;font:inherit;background:white}.back{cursor:pointer}.error{background:#fff0f0;color:#9b1c1c;padding:12px;border-radius:10px}.sub{font-size:13px;color:#777;margin-top:6px}@media(max-width:600px){.clip{flex-direction:column}.actions{justify-content:flex-start}.toolbar label,.toolbar select,.toolbar input{width:100%}}
</style></head><body><header><div class="wrap"><h1>MHS Freshman Volleyball</h1><p>2026 match highlights · Player highlight history</p></div></header><main>
<p id="status" class="muted">Loading highlights…</p>
<section id="home"><h2>Players</h2><p class="muted">Select a player to browse available highlights from any team or season.</p><div id="players" class="grid"></div><h2>Match Dates</h2><p class="muted">Current MHS team games only.</p><div id="dates"></div></section>
<section id="detail" class="hidden"><button id="back" class="back" type="button">← Back to team</button><h2 id="detailTitle"></h2><p id="detailInfo" class="muted"></p><div id="filters" class="toolbar"><label id="teamLabel">Team<select id="teamFilter"></select></label><label>Year<select id="yearFilter"></select></label><label>Play type<select id="typeFilter"></select></label><label>Search<input id="searchFilter" type="search" placeholder="Opponent or play"></label></div><p id="count" class="muted"></p><div id="results"></div></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
const state={roster:[],games:[],clips:[],history:[],gameMap:new Map(),byDate:new Map(),view:null,selected:null};
const TZ='America/New_York';
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function dateKey(ts){const n=Number(ts);if(!Number.isFinite(n)||n<=0)return '';const parts=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(n*1000));const part=k=>parts.find(x=>x.type===k)?.value||'';return `${part('year')}-${part('month')}-${part('day')}`}
function prettyDate(key){if(!key)return 'Date unknown';return new Date(key+'T12:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',month:'short',day:'numeric',year:'numeric'})}
function opponent(g){return g.scoreOpponentName||g.nameOpponent||g.opponentName||g.textMatchupName||'Match'}
function clipDate(c){return dateKey(c.startTs)||dateKey(state.gameMap.get(c.gameId)?.scheduleTsStart)}
function tags(c){return (c.playTypes&&c.playTypes.length?c.playTypes:[c.playType]).filter(Boolean)}
function clipVideo(c){return typeof c.fileDownloadUrl==='string'&&/^https:\/\//i.test(c.fileDownloadUrl)?c.fileDownloadUrl:null}
function setOptions(id,entries,all){const e=$(id);e.replaceChildren(new Option(all,''));for(const [v,label] of entries)e.add(new Option(label,v))}
function navigate(hash){if(location.hash!==hash)history.pushState(null,'',hash||location.pathname);showRoute()}
function showRoute(){const params=new URLSearchParams(location.hash.replace(/^#/,''));const player=params.get('player'),day=params.get('date');const p=state.roster.find(p=>p.id===player);state.view=p?'player':day&&state.byDate.has(day)?'date':null;state.selected=p||day;$('home').classList.toggle('hidden',!!state.view);$('detail').classList.toggle('hidden',!state.view);if(!state.view)return;for(const id of ['teamFilter','yearFilter','typeFilter','searchFilter'])$(id).value='';if(p){$('detailTitle').textContent=p.name;$('detailInfo').textContent=p.claimedPlayerId?'Available highlights from all teams and seasons':'This profile is not claimed yet. Historical clips will appear when available.';$('teamLabel').classList.remove('hidden')}else{$('detailTitle').textContent=prettyDate(day);$('detailInfo').textContent='MHS team match highlights';$('teamLabel').classList.add('hidden')}buildFilters();renderResults();window.scrollTo(0,0)}
function viewRows(){if(state.view==='player')return state.history.filter(c=>c.playerId===state.selected.claimedPlayerId);if(state.view==='date'){const ids=new Set((state.byDate.get(state.selected)||[]).map(g=>g.id));return state.clips.filter(c=>ids.has(c.gameId))}return []}
function teamName(c){if(state.gameMap.has(c.gameId))return 'MHS Freshman 2026';return c.teamId?'Previous team ('+c.teamId+')':'Previous / unknown team'}
function buildFilters(){const rows=viewRows();const teams=[...new Set(rows.map(teamName))].sort();setOptions('teamFilter',teams.map(x=>[x,x]),'All teams');const years=[...new Set(rows.map(c=>clipDate(c).slice(0,4)).filter(Boolean))].sort().reverse();setOptions('yearFilter',years.map(x=>[x,x]),'All years');const types=[...new Set(rows.flatMap(tags))].sort();setOptions('typeFilter',types.map(x=>[x,x]),'All play types')}
function renderResults(){const t=$('teamFilter').value,y=$('yearFilter').value,kind=$('typeFilter').value,q=$('searchFilter').value.toLowerCase().trim();const rows=viewRows().filter(c=>(!t||teamName(c)===t)&&(!y||clipDate(c).startsWith(y))&&(!kind||tags(c).includes(kind))&&(!q||[c.playerName,c.textMatchupName,opponent(state.gameMap.get(c.gameId)||{}),...tags(c)].join(' ').toLowerCase().includes(q)));$('count').textContent=`${rows.length} highlight${rows.length===1?'':'s'} shown`;$('results').replaceChildren();if(!rows.length){$('results').append(node('p','muted','No clips available for this selection.'));return}const frag=document.createDocumentFragment();for(const c of rows){const card=node('article','clip'),info=node('div','info'),title=state.view==='player'?(c.textMatchupName||opponent(state.gameMap.get(c.gameId)||{})):c.playerName||'Player';info.append(node('h3','',title));info.append(node('div','muted',[prettyDate(clipDate(c)),teamName(c)].join(' · ')));for(const tag of tags(c))info.append(node('span','tag',tag));card.append(info);const actions=node('div','actions'),url=clipVideo(c);if(url){const view=node('a','','View clip ↗');view.href=url;view.target='_blank';view.rel='noopener noreferrer';actions.append(view);const download=node('a','','Download / Save');download.href=url;download.download=`volleyball-${c.id}.mp4`;download.target='_blank';download.rel='noopener noreferrer';download.title='If the video opens instead of downloading, use your browser’s Save video as option.';actions.append(download)}else actions.append(node('span','muted','Video link unavailable'));card.append(actions);frag.append(card)}$('results').append(frag)}
function renderHome(){const root=$('players');root.replaceChildren();const counts=new Map();for(const c of state.history)counts.set(c.playerId,(counts.get(c.playerId)||0)+1);for(const p of [...state.roster].sort((a,b)=>(Number(a.jerseyNum)||999)-(Number(b.jerseyNum)||999)||a.name.localeCompare(b.name))){const btn=node('button','player');btn.type='button';const avatar=node('span','avatar',p.jerseyNum?'#'+p.jerseyNum:p.name.slice(0,1));const content=node('span');content.append(node('strong','',p.name));content.append(node('div','sub',p.claimedPlayerId?`${counts.get(p.claimedPlayerId)||0} available clips`:'Not claimed yet'));btn.append(avatar,content);btn.addEventListener('click',()=>navigate('#player='+encodeURIComponent(p.id)));root.append(btn)}const dates=$('dates');dates.replaceChildren();const keys=[...state.byDate.keys()].sort().reverse();for(const key of keys){const games=state.byDate.get(key),ids=new Set(games.map(g=>g.id)),count=state.clips.filter(c=>ids.has(c.gameId)).length;const btn=node('button','match');btn.type='button';const content=node('span');content.append(node('strong','',prettyDate(key)));content.append(node('div','sub',`${games.map(opponent).join(' / ')} · ${count} player-tagged clips`));btn.append(content,node('span','','View →'));btn.addEventListener('click',()=>navigate('#date='+encodeURIComponent(key)));dates.append(btn)}if(!keys.length)dates.append(node('p','muted','No scheduled games found.'))}
async function load(){try{const paths=['data/roster.json','data/games.json','data/clips.json','data/player-history.json'];const [r,g,c,h]=await Promise.all(paths.map(async path=>{const res=await fetch(path,{cache:'no-cache'});if(!res.ok)throw new Error(`${path}: HTTP ${res.status}`);return res.json()}));if(!Array.isArray(r.players)||!Array.isArray(g.games)||!Array.isArray(c.clips)||!Array.isArray(h.clips))throw new Error('Unexpected JSON format');state.roster=r.players;state.games=g.games;state.clips=c.clips;state.history=h.clips;state.gameMap=new Map(state.games.map(g=>[g.id,g]));for(const g of state.games){const key=dateKey(g.scheduleTsStart);if(!key)continue;if(!state.byDate.has(key))state.byDate.set(key,[]);state.byDate.get(key).push(g)}$('status').textContent=`${state.roster.length} players · ${state.games.length} games · ${state.history.length} player-history clips`;renderHome();showRoute()}catch(err){$('status').className='error';$('status').textContent=`Unable to load data: ${err.message}`;console.error(err)}}
$('back').addEventListener('click',()=>navigate(''));for(const id of ['teamFilter','yearFilter','typeFilter','searchFilter'])$(id).addEventListener('input',renderResults);window.addEventListener('hashchange',showRoute);load();
</script></body></html>
